[project]
name = "openjev"
version = "0.3.0"
description = "Open, Jev-compatible System One decision server on DiffusionGemma"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "transformers>=4.56", "tokenizers", "jinja2"]

[project.optional-dependencies]
test = ["pytest", "typesafe-sdk>=0.7"]
# Apple silicon: the in-process MLX backend (OPENJEV_BACKEND=mlx)
mlx = ["mlx-vlm==0.6.15; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Homepage = "https://codiv.ai"
Source = "https://github.com/razorback16/openjev"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
